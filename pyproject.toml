[project]
name = "wolgeup-itda-integrated"
version = "0.1.0"
description = "FastAPI backend and payroll agent in one Python runtime"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1", "pydantic-settings>=2.7,<3",
  "langgraph==1.2.8", "langchain-openai==1.3.3", "langchain-core==1.4.8",
  "pydantic==2.13.4", "python-dotenv==1.2.2", "pypdf>=6,<7",
  "reportlab>=4,<5", "pillow>=12,<13", "olefile==0.47",
  "tzdata>=2026.1", "pypdfium2==5.14.0",
]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2", "jsonschema>=4,<5", "ruff>=0.15,<1", "fonttools>=4,<5"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/integration", "tests/backend", "agent/tests"]
asyncio_mode = "auto"
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
addopts = "--basetemp=.pytest-tmp"
markers = ["private_corpus: private source documents not distributed", "real_ocr: requires OCR runtime"]

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
