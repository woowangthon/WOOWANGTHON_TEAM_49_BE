name: Backend CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/woowangthon/woowangthon_team_49_be

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Ruff lint
        run: uv run ruff check app agent tests/integration

      - name: Pytest
        run: |
          uv run pytest tests/integration -q
          uv run pytest tests/backend -q
          uv run pytest agent/tests -q

  build:
    name: Build & Push Docker Image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:main
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-24.04
    environment: production

    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy image to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          ssh -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/id_ed25519 \
            "dev1@$EC2_HOST" \
            "IMAGE_TAG=$IMAGE_TAG bash -se" <<'REMOTE'
          set -euo pipefail

          cd /home/ubuntu/WOOWANGTHON_TEAM_49_BE

          export API_IMAGE="ghcr.io/woowangthon/woowangthon_team_49_be:${IMAGE_TAG}"

          sudo -n docker compose \
            --env-file .env.production \
            config --quiet

          sudo -n docker compose \
            --env-file .env.production \
            pull api

          sudo -n docker compose \
            --env-file .env.production \
            up -d --no-build --wait api

          curl -fsS http://127.0.0.1:8000/health

          sudo -n docker compose \
            --env-file .env.production \
            ps

          echo "Deployed $API_IMAGE"
          REMOTE
